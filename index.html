<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pag-IBIG NCR Super Sale (Negotiated Sale) Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #sidebar { width: 340px; min-width: 300px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto; z-index: 1000; }
    h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    .stat-val { font-size: 1.15rem; font-weight: 700; color: #f8fafc; }
    .stat-lbl { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.78rem; font-weight: 600; color: #cbd5e1; }
    select, input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.85rem; }
    select:focus, input:focus { outline: none; border-color: #38bdf8; }
    .legend { display: flex; gap: 14px; font-size: 0.78rem; color: #cbd5e1; padding: 6px 0; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    .btn-reset { background: #334155; color: #f8fafc; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .btn-reset:hover { background: #475569; }
    #map { flex: 1; height: 100vh; }
    .leaflet-popup-content-wrapper { border-radius: 10px; }
    .popup-title { font-weight: 700; font-size: 0.95rem; color: #0f172a; margin-bottom: 4px; }
    .popup-price { font-size: 1.05rem; font-weight: 800; color: #0284c7; margin-bottom: 6px; }
    .popup-meta { font-size: 0.8rem; color: #334155; line-height: 1.45; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .badge-unocc { background: #16a34a; }
    .badge-occ { background: #d97706; }
    .popup-link { display: inline-block; margin-top: 8px; font-size: 0.8rem; font-weight: 600; color: #0284c7; text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: 42vh; min-width: unset; border-right: none; border-bottom: 1px solid #334155; }
      #map { height: 58vh; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div>
      <h1>Pag-IBIG NCR Super Sale Map</h1>
      <p class="subtitle">Negotiated Sale listings (up to 40%–45% off appraised value) from Pag-IBIG Online Public Auction.</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-val" id="stat-count">0</div>
        <div class="stat-lbl">Matching Properties</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-min">₱0</div>
        <div class="stat-lbl">Lowest Price</div>
      </div>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:#16a34a"></span>Unoccupied</span>
      <span><span class="dot" style="background:#d97706"></span>Occupied</span>
    </div>

    <div class="filter-group">
      <label for="f-search">Search Address / Subdivision / ROPA ID</label>
      <input type="text" id="f-search" placeholder="e.g. Urban Deca, Tondo, Pasig..." />
    </div>

    <div class="filter-group">
      <label for="f-city">City / Municipality</label>
      <select id="f-city"><option value="">All NCR Cities</option></select>
    </div>

    <div class="filter-group">
      <label for="f-type">Property Type</label>
      <select id="f-type"><option value="">All Property Types</option></select>
    </div>

    <div class="filter-group">
      <label for="f-occ">Occupancy Status</label>
      <select id="f-occ"><option value="">All Statuses</option></select>
    </div>

    <div class="filter-group">
      <label for="f-price">Max Price (₱): <span id="f-price-lbl">Any</span></label>
      <input type="range" id="f-price" min="200000" max="10000000" step="100000" value="10000000" />
    </div>

    <button class="btn-reset" id="btn-reset">Reset Filters</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    let map = null;
    let cluster = null;
    if (typeof L !== 'undefined') {
      map = L.map('map').setView([14.5995, 121.0000], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
      cluster = typeof L.markerClusterGroup === 'function'
        ? L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45 })
        : L.layerGroup();
      map.addLayer(cluster);
    } else {
      document.getElementById('map').innerHTML = '<div style="padding:24px;color:#94a3b8;">Map library (Leaflet) could not be loaded in this preview environment. Open the HTML file directly in your browser to view the interactive map.</div>';
    }

    const fSearch = document.getElementById('f-search');
    const fCity = document.getElementById('f-city');
    const fType = document.getElementById('f-type');
    const fOcc = document.getElementById('f-occ');
    const fPrice = document.getElementById('f-price');
    const fPriceLbl = document.getElementById('f-price-lbl');

    const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();
    uniq(DATA.map(d => d.city)).forEach(c => fCity.add(new Option(c, c)));
    uniq(DATA.map(d => d.type)).forEach(t => fType.add(new Option(t, t)));
    uniq(DATA.map(d => d.occ)).forEach(o => fOcc.add(new Option(o, o)));

    const fmtPHP = (n) => '₱' + Number(n).toLocaleString('en-PH', { maximumFractionDigits: 0 });

    function makeIcon(isUnocc) {
      const color = isUnocc ? '#16a34a' : '#d97706';
      return L.divIcon({
        className: 'custom-pin',
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.5);"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
    }

    function render() {
      const q = fSearch.value.trim().toLowerCase();
      const city = fCity.value;
      const type = fType.value;
      const occ = fOcc.value;
      const maxP = Number(fPrice.value);
      fPriceLbl.textContent = maxP >= 10000000 ? 'Any' : fmtPHP(maxP);

      const filtered = DATA.filter(d => {
        if (city && d.city !== city) return false;
        if (type && d.type !== type) return false;
        if (occ && d.occ !== occ) return false;
        if (maxP < 10000000 && d.price > maxP) return false;
        if (q && !(`${d.loc} ${d.sub} ${d.city} ${d.id}`.toLowerCase().includes(q))) return false;
        return true;
      });

      if (cluster) {
        cluster.clearLayers();
        const markers = filtered.map(d => {
          const isUnocc = d.occ.toLowerCase().includes('unoccupied');
          const m = L.marker([d.lat, d.lng], { icon: makeIcon(isUnocc) });
          m.bindPopup(`
            <div style="min-width:220px">
              <span class="badge ${isUnocc ? 'badge-unocc' : 'badge-occ'}">${d.occ || 'N/A'}</span>
              <div class="popup-title">${d.type} — ${d.city}</div>
              <div class="popup-price">${fmtPHP(d.price)}</div>
              <div class="popup-meta">
                <b>Location:</b> ${d.loc}<br/>
                ${d.sub ? `<b>Subdivision/Condo:</b> ${d.sub}<br/>` : ''}
                <b>Lot / Floor:</b> ${d.lot} sqm / ${d.floor} sqm<br/>
                <b>ROPA ID:</b> ${d.id} &nbsp;|&nbsp; <b>Batch:</b> ${d.batch}<br/>
                <b>Req. Gross Income:</b> ${fmtPHP(d.gross)}/mo<br/>
                <i>Pin precision: ${d.prec === 'subdivision' ? 'Subdivision/Condo' : 'City centroid'}</i>
              </div>
              <a class="popup-link" href="https://www.pagibigfundservices.com/OnlinePublicAuction" target="_blank">Open Pag-IBIG OPA &rarr;</a>
            </div>
          `);
          return m;
        });
        cluster.addLayers(markers);
      }

      document.getElementById('stat-count').textContent = filtered.length.toLocaleString();
      const minP = filtered.length ? Math.min(...filtered.map(d => d.price)) : 0;
      document.getElementById('stat-min').textContent = filtered.length ? fmtPHP(minP) : '—';
    }

    [fSearch, fCity, fType, fOcc, fPrice].forEach(el => el.addEventListener('input', render));
    document.getElementById('btn-reset').addEventListener('click', () => {
      fSearch.value = '';
      fCity.value = '';
      fType.value = '';
      fOcc.value = '';
      fPrice.value = 10000000;
      render();
    });

    render();
  </script>
