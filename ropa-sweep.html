<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q4 Commercial Bank ROPA "Failed-Bidding" Sweep</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #sidebar { width: 370px; min-width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto; z-index: 1000; }
    .nav-bar { display: flex; gap: 8px; font-size: 0.78rem; }
    .nav-link { color: #38bdf8; text-decoration: none; font-weight: 600; }
    .nav-link:hover { text-decoration: underline; }
    h1 { font-size: 1.08rem; font-weight: 700; color: #38bdf8; }
    .subtitle { font-size: 0.78rem; color: #94a3b8; line-height: 1.4; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: #f8fafc; }
    .stat-lbl { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.76rem; font-weight: 600; color: #cbd5e1; display: flex; justify-content: space-between; }
    select, input[type="number"], input[type="text"] { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.84rem; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #cbd5e1; cursor: pointer; }
    .btn-reset { background: #334155; color: #f8fafc; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .btn-reset:hover { background: #475569; }
    #map { flex: 1; height: 100vh; }
    .leaflet-popup-content-wrapper { border-radius: 10px; }
    .popup-title { font-weight: 700; font-size: 0.94rem; color: #0f172a; margin-bottom: 4px; }
    .popup-price { font-size: 0.92rem; color: #475569; text-decoration: line-through; }
    .popup-bid { font-size: 1.05rem; font-weight: 800; color: #16a34a; margin-bottom: 6px; }
    .popup-meta { font-size: 0.78rem; color: #334155; line-height: 1.45; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; color: #fff; margin-right: 4px; margin-bottom: 6px; }
    .badge-green { background: #16a34a; }
    .badge-occ { background: #d97706; }
    .badge-rounds { background: #0284c7; }
    .badge-bank { background: #475569; }
    .popup-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .btn-letter { background: #0284c7; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
    .btn-letter:hover { background: #0369a1; }
    .popup-link { font-size: 0.78rem; font-weight: 600; color: #0284c7; text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }
    /* Modal */
    #letter-modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
    #letter-modal.open { display: flex; }
    .modal-box { background: #1e293b; border: 1px solid #475569; border-radius: 10px; max-width: 680px; width: 100%; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 1rem; color: #38bdf8; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }
    #letter-text { width: 100%; height: 320px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.8rem; line-height: 1.45; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: 45vh; min-width: unset; border-right: none; border-bottom: 1px solid #334155; }
      #map { height: 55vh; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="nav-bar">
      <a href="index.html" class="nav-link">&larr; Pag-IBIG Super Sale Map</a>
    </div>
    <div>
      <h1>Q4 Commercial Bank ROPA Sweep</h1>
      <p class="subtitle">Exercise #1: Filter BPI Buena Mano, BDO, Metrobank &amp; Security Bank for Green-Tag (clean title, unoccupied) condos with 2+ failed sealed bidding rounds.</p>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-val" id="stat-count">0</div>
        <div class="stat-lbl">Matching Condos</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-min-bid">₱0</div>
        <div class="stat-lbl">Lowest Target Bid</div>
      </div>
    </div>

    <div class="filter-group">
      <label for="filter-bank">Bank</label>
      <select id="filter-bank">
        <option value="">All Banks (Philippine Universal, Commercial &amp; Thrift)</option>
        <option value="BPI Buena Mano">BPI Buena Mano</option>
        <option value="BDO">BDO Unibank</option>
        <option value="Metrobank">Metrobank</option>
        <option value="Security Bank">Security Bank</option>
        <option value="PSBank">PSBank</option>
        <option value="RCBC">RCBC</option>
        <option value="EastWest Bank">EastWest Bank</option>
        <option value="PNB">PNB</option>
        <option value="Landbank">Landbank</option>
        <option value="Chinabank">Chinabank</option>
        <option value="UnionBank">UnionBank</option>
        <option value="DBP">DBP</option>
        <option value="AUB">Asia United Bank (AUB)</option>
        <option value="Bank of Commerce">Bank of Commerce</option>
        <option value="PBCom">PBCom</option>
        <option value="Philtrust Bank">Philtrust Bank</option>
        <option value="Veterans Bank">Philippine Veterans Bank</option>
        <option value="Maybank Philippines">Maybank Philippines</option>
        <option value="China Bank Savings">China Bank Savings</option>
        <option value="Philippine Business Bank">Philippine Business Bank</option>
        <option value="Sterling Bank of Asia">Sterling Bank of Asia</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-city">City (NCR)</label>
      <select id="filter-city">
        <option value="">All Cities</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-discount">
        <span>Target Lowball Discount</span>
        <span id="discount-val">45% off</span>
      </label>
      <input type="range" id="filter-discount" min="35" max="50" step="1" value="45" />
    </div>

    <div class="filter-group">
      <label for="filter-rounds">Min Failed Bidding Rounds</label>
      <select id="filter-rounds">
        <option value="2" selected>2+ Failed Rounds (Exercise #1)</option>
        <option value="3">3+ Failed Rounds (High Motivation)</option>
        <option value="1">1+ Failed Rounds</option>
      </select>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="filter-greentag" checked />
      Green-Tag Only (Clean Title + Unoccupied)
    </label>

    <button class="btn-reset" id="btn-reset">Reset Filters</button>
  </div>

  <div id="map"></div>

  <div id="letter-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Q4 Negotiated Offer Letter</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <textarea id="letter-text" readonly></textarea>
      <div class="modal-actions">
        <button class="btn-reset" id="btn-copy">Copy to Clipboard</button>
        <button class="btn-letter" id="btn-download">Download .txt</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const FALLBACK_DATA = [
      { ref_id: "BPI-BM-2026-0412", bank: "BPI Buena Mano", property_name: "Avida Towers San Lorenzo - Unit 1408", property_type: "Condominium", city: "Makati", address: "Chino Roces Ave., Brgy. San Lorenzo, Makati City", floor_area_sqm: 36.5, asking_price: 5400000, title_status: "Clean", occupancy: "Unoccupied", failed_bidding_rounds: 3, lat: 14.5528, lng: 121.0145, portal_url: "https://www.buenamano.ph/" },
      { ref_id: "BDO-ROPA-2026-1104", bank: "BDO", property_name: "Azure Urban Resort Residences - Maui 912", property_type: "Condominium", city: "Parañaque", address: "Km 16 West Service Rd., Parañaque City", floor_area_sqm: 30.2, asking_price: 4150000, title_status: "Clean", occupancy: "Unoccupied", failed_bidding_rounds: 4, lat: 14.4864, lng: 121.0451, portal_url: "https://www.bdo.com.ph/personal/assets-for-sale/real-estate" },
      { ref_id: "MB-AA-2026-0771", bank: "Metrobank", property_name: "One Eastwood Avenue - Tower 1 Unit 18F", property_type: "Condominium", city: "Quezon City", address: "Eastwood City, Quezon City", floor_area_sqm: 42.5, asking_price: 6300000, title_status: "Clean", occupancy: "Unoccupied", failed_bidding_rounds: 3, lat: 14.6102, lng: 121.0792, portal_url: "https://www.metrobank.com.ph/assets-for-sale/properties" },
      { ref_id: "SBC-RA-2026-0319", bank: "Security Bank", property_name: "The Rochester - Breeze Tower Unit 7G", property_type: "Condominium", city: "Pasig", address: "Elisco Rd., Pasig City", floor_area_sqm: 32.1, asking_price: 3600000, title_status: "Clean", occupancy: "Unoccupied", failed_bidding_rounds: 3, lat: 14.5542, lng: 121.0778, portal_url: "https://www.securitybank.com/personal/loans/repossessed-assets/properties-for-sale/" }
    ];

    const map = L.map("map").setView([14.5764, 121.045], 12);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      maxZoom: 19
    }).addTo(map);

    const markers = L.markerClusterGroup();
    map.addLayer(markers);

    let allProperties = [];
    let currentLetterRef = "offer";

    const fmtPHP = (n) => "₱" + Math.round(n).toLocaleString("en-PH");

    function buildLetter(prop, discountPct) {
      const bid = prop.asking_price * (1 - discountPct / 100);
      const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
      return `Date: ${today}
To: ${prop.bank} — Acquired Assets / Disposal Officer
Subject: Q4 Negotiated Offer to Buy — ${prop.property_name} (Ref: ${prop.ref_id})

Dear Disposal Officer,

I am submitting a formal, cash-backed Offer to Buy for the following Green-Tag (clean title, unoccupied) condominium unit:

  • Property: ${prop.property_name}
  • Location: ${prop.address}, ${prop.city}
  • Floor Area: ${prop.floor_area_sqm} sqm
  • Reference No.: ${prop.ref_id}
  • Listed Asking Price: ${fmtPHP(prop.asking_price)}
  • Prior Sealed Bidding Rounds: ${prop.failed_bidding_rounds}+ failed rounds

Given that this asset has remained in inventory after ${prop.failed_bidding_rounds}+ sealed bidding rounds, I am submitting a firm Q4 negotiated offer of:

  >>> OFFER PRICE: ${fmtPHP(bid)} (${discountPct}% below listed price) <<<

Key Terms for Fast Year-End Closing:
  1. Payment Terms: Cash / Manager's Check ready for immediate closing before year-end.
  2. Condition: "As-Is, Where-Is" basis; no contingencies on unit repairs.
  3. Timeline: Ready to submit earnest money deposit within 48 hours of offer acceptance.

Please let me know if we can proceed with formal documentation.

Sincerely,
[Your Name]
[Your Contact Number / Email]`;
    }

    function render() {
      const bank = document.getElementById("filter-bank").value;
      const city = document.getElementById("filter-city").value;
      const discount = Number(document.getElementById("filter-discount").value);
      const minRounds = Number(document.getElementById("filter-rounds").value);
      const greenTagOnly = document.getElementById("filter-greentag").checked;

      document.getElementById("discount-val").textContent = `${discount}% off`;
      markers.clearLayers();

      const filtered = allProperties.filter((p) => {
        if (bank && p.bank !== bank) return false;
        if (city && p.city !== city) return false;
        if (p.failed_bidding_rounds < minRounds) return false;
        if (greenTagOnly && (p.title_status !== "Clean" || p.occupancy !== "Unoccupied")) return false;
        return true;
      });

      let minBid = Infinity;
      filtered.forEach((p) => {
        const targetBid = p.asking_price * (1 - discount / 100);
        if (targetBid < minBid) minBid = targetBid;

        const isGreen = p.title_status === "Clean" && p.occupancy === "Unoccupied";
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 9,
          fillColor: isGreen ? "#16a34a" : "#d97706",
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });

        const popupHtml = `
          <div>
            <span class="badge badge-bank">${p.bank}</span>
            <span class="badge ${isGreen ? "badge-green" : "badge-occ"}">${isGreen ? "Green-Tag" : p.occupancy}</span>
            <span class="badge badge-rounds">${p.failed_bidding_rounds}x Failed</span>
            <div class="popup-title">${p.property_name}</div>
            <div class="popup-price">Asking: ${fmtPHP(p.asking_price)}</div>
            <div class="popup-bid">Target Bid (${discount}% off): ${fmtPHP(targetBid)}</div>
            <div class="popup-meta">
              <strong>Ref:</strong> ${p.ref_id}<br/>
              <strong>City:</strong> ${p.city} | <strong>Area:</strong> ${p.floor_area_sqm} sqm<br/>
              <strong>Title:</strong> ${p.title_status} | <strong>Status:</strong> ${p.occupancy}
            </div>
            <div class="popup-actions">
              <button class="btn-letter" onclick="openLetter('${p.ref_id}')">Generate Q4 Bid Letter</button>
              <a class="popup-link" href="${p.portal_url}" target="_blank" rel="noopener">Bank Portal &rarr;</a>
            </div>
          </div>
        `;
        marker.bindPopup(popupHtml);
        markers.addLayer(marker);
      });

      document.getElementById("stat-count").textContent = filtered.length;
      document.getElementById("stat-min-bid").textContent = filtered.length ? fmtPHP(minBid) : "₱0";
    }

    window.openLetter = (refId) => {
      const prop = allProperties.find((p) => p.ref_id === refId);
      if (!prop) return;
      const discount = Number(document.getElementById("filter-discount").value);
      currentLetterRef = refId;
      document.getElementById("letter-text").value = buildLetter(prop, discount);
      document.getElementById("letter-modal").classList.add("open");
    };

    document.getElementById("modal-close").onclick = () => document.getElementById("letter-modal").classList.remove("open");
    document.getElementById("btn-copy").onclick = () => {
      const ta = document.getElementById("letter-text");
      ta.select();
      navigator.clipboard?.writeText(ta.value);
    };
    document.getElementById("btn-download").onclick = () => {
      const blob = new Blob([document.getElementById("letter-text").value], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Q4_Bid_Offer_${currentLetterRef}.txt`;
      a.click();
    };

    ["filter-bank", "filter-city", "filter-discount", "filter-rounds", "filter-greentag"].forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });

    document.getElementById("btn-reset").onclick = () => {
      document.getElementById("filter-bank").value = "";
      document.getElementById("filter-city").value = "";
      document.getElementById("filter-discount").value = "45";
      document.getElementById("filter-rounds").value = "2";
      document.getElementById("filter-greentag").checked = true;
      render();
    };

    fetch("data/ropa_condos.json")
      .then((r) => r.json())
      .catch(() => FALLBACK_DATA)
      .then((data) => {
        allProperties = data;
        const cities = [...new Set(data.map((d) => d.city))].sort();
        const citySel = document.getElementById("filter-city");
        cities.forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          citySel.appendChild(opt);
        });
        render();
      });
  </script>
</body>
</html>
